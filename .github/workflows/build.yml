name: Build and Check
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - develop
jobs:
  build:
    name: Build
    uses: Logius-standaarden/Automatisering/.github/workflows/build.yml@main
  check:
    needs: build
    name: Check
    uses: Logius-standaarden/Automatisering/.github/workflows/check.yml@main
  publish:
    needs: build
    name: Publish (Logius)
    uses: Logius-standaarden/Automatisering/.github/workflows/publish.yml@main
    secrets: inherit
  linter_testcases:
    name: Linter test cases
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run test suite
        run: |
          npm install -g openlint
          node linter/run-linter-tests.mjs
  examples_linter:
    needs: linter_testcases
    name: Examples linter tests
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        example: [ aspnet, express, golang, python, quarkus ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
      - name: Setup .NET 9.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          cache: 'pip'
      - name: Install dependencies
        run: pip install fastapi uvicorn
      - name: Install Openlint
        run: npm install -g openlint
      - name: Run linter on ${{ matrix.example }} example
        run: ./examples/${{ matrix.example }}/build-and-check-project.sh
